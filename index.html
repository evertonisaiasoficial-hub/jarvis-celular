:root{--fundo:#0D0D0F;--cartao:#17181C;--borda:#26282E;--texto:#FFFFFF;--apagado:#8C9098;--verde:#4ADE80;--azul:#60A5FA;--precisa:#FACC5A;--vermelho:#F87171;--lilas:#C4B5FD;--livre:#303238}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--fundo);min-height:100%;min-height:-webkit-fill-available}
body{background:var(--fundo);color:var(--texto);font-family:'JVInter',system-ui,sans-serif;overflow:hidden;min-height:100vh;min-height:-webkit-fill-available;user-select:none;-webkit-user-select:none;-webkit-text-size-adjust:100%}
button,input{font-family:inherit}
#app{position:fixed;top:0;left:0;right:0;height:var(--vh,100%);display:flex;flex-direction:column;padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left)}
body.semlogin #app,body.travado #app{visibility:hidden}
#rola{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:12px 16px 20px}
#puxa{height:0;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:500;color:var(--apagado)}
#semContato{display:none;margin-bottom:14px;padding:16px 18px;border-radius:20px;border:1px solid rgba(250,204,90,.45);background:rgba(250,204,90,.1)}
#semContato.on{display:block}
#semContato b{display:block;font-size:19px;font-weight:700;color:var(--precisa)}
#semContato small{display:block;margin-top:4px;font-size:14px;color:#e6d9b4}
#cartoes{display:flex;flex-direction:column;gap:14px}
.jan{position:relative;background:var(--cartao);border:1px solid var(--borda);border-radius:22px;padding:18px}
.jan .l1{display:flex;align-items:center;justify-content:space-between;gap:12px}
.jan h2{font-size:20px;font-weight:700;letter-spacing:-.01em;min-width:0}
.sit{flex:0 0 auto;display:inline-flex;align-items:center;gap:7px;padding:6px 12px;border-radius:999px;font-size:14px;font-weight:600;color:var(--cor);background:color-mix(in srgb,var(--cor) 15%,transparent)}
.sit i{width:8px;height:8px;border-radius:50%;background:var(--cor)}
.jan .tit{margin-top:12px;font-size:16.5px;line-height:1.4;font-weight:400;color:#E8E9EC;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.jan .nota{margin-top:6px;font-size:14px;font-weight:500;color:var(--cor)}
.jan .l2{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-top:14px}
.jan .parte{font-size:17px;font-weight:600}
.jan .tempo{font-size:14px;color:var(--apagado);text-align:right}
.jan .barra{margin-top:9px;height:5px;border-radius:3px;background:var(--livre);overflow:hidden}
.jan .barra i{display:block;height:100%;border-radius:3px;background:var(--cor);transition:width .5s}
.jan .fila{margin-top:11px;font-size:14px;color:var(--apagado)}
.jan.livre{padding:15px 18px}
.jan.livre h2{font-size:17px;font-weight:600;color:#C9CCD2}
.jan.livre .fila{margin-top:5px}
.jan.trab{border-color:rgba(74,222,128,.55);background:linear-gradient(180deg,rgba(74,222,128,.09),rgba(74,222,128,0) 60%),var(--cartao)}
.jan.trab::after{content:"";position:absolute;inset:-1px;border-radius:22px;box-shadow:0 0 26px rgba(74,222,128,.38);opacity:.25;animation:pulso 3.2s ease-in-out infinite;pointer-events:none}
.jan.trab .sit i{animation:respira 1.6s ease-in-out infinite alternate}
@keyframes pulso{0%,100%{opacity:.2}50%{opacity:1}}
@keyframes respira{from{opacity:.35}to{opacity:1}}
@media (prefers-reduced-motion:reduce){.jan.trab::after,.jan.trab .sit i{animation:none}}
#cartoes.velho{opacity:.45;filter:grayscale(1)}
#cartoes.velho .jan::after,#cartoes.velho .sit i{animation:none}
.vazio{padding:40px 12px;text-align:center;font-size:16px;line-height:1.5;color:var(--apagado)}
#pe{flex:0 0 auto;display:flex;justify-content:center;padding:6px 16px calc(env(safe-area-inset-bottom) + 6px)}
#renova{display:inline-flex;align-items:center;gap:8px;padding:7px 15px;border-radius:999px;background:var(--cartao);border:1px solid var(--borda);font-size:13px;font-weight:500;color:var(--apagado)}
#renova b{font-weight:600;color:#D6D8DD}
.tela{position:fixed;inset:0;z-index:40;display:none;align-items:center;justify-content:center;background:var(--fundo);padding:24px}
.tela.on{display:flex}
.caixa{width:100%;max-width:380px;padding:24px;border-radius:22px;background:var(--cartao);border:1px solid var(--borda)}
.caixa h2{font-size:22px;font-weight:700;margin-bottom:8px}
.caixa p{font-size:14px;line-height:1.5;color:var(--apagado);margin-bottom:16px}
.caixa input{width:100%;padding:14px;margin-bottom:10px;border-radius:14px;border:1px solid var(--borda);background:#101114;color:var(--texto);font-size:16px;user-select:text;-webkit-user-select:text}
.caixa button{width:100%;padding:15px;border-radius:14px;border:0;background:var(--verde);color:#06210f;font-size:17px;font-weight:700}
.caixa button.sec{margin-top:10px;background:var(--livre);color:var(--texto);font-size:15px}
.caixa .err{min-height:20px;margin-bottom:8px;font-size:13px;color:var(--vermelho)}
</style></head>
<body>

<div id="app">
  <main id="rola">
    <div id="puxa">Puxe para atualizar</div>
    <div id="semContato" role="status"><b>Sem contato com o PC</b><small id="semHora"></small></div>
    <div id="cartoes"><div class="vazio">Carregando…</div></div>
  </main>
  <footer id="pe"><div id="renova">↻ <span>Renova</span> <b id="renovaTxt">…</b></div></footer>
</div>
<div class="tela" id="login"><div class="caixa">
  <h2>Jarvis</h2>
  <p>Entre com a conta do dono (a mesma do Cuida Aí). Só o dono vê o Jarvis.</p>
  <input id="em" type="email" placeholder="E-mail" autocomplete="username" autocapitalize="none">
  <input id="sn" type="password" placeholder="Senha" autocomplete="current-password">
  <div class="err" id="loginErr"></div>
  <button id="entrar">Entrar</button>
</div></div>
<div class="tela" id="trava"><div class="caixa">
  <h2>Jarvis 🔒</h2>
  <p>App trancado.</p>
  <div class="err" id="travaErr"></div>
  <button id="travaAbre">Entrar</button>
  <button class="sec" id="travaSai" style="display:none">Entrar com e-mail e senha</button>
</div></div>

<script src="config.js"></script>
<script>

/* ====== Jarvis iPhone: uma tela só de vistoria ====== */
const VERSAO = "v86";
const CFG = window.JARVIS_CFG;
/* v10.4: o iOS limpa o localStorage de PWA parada; a sessão, a chave do Face ID e a hora do último Face ID também ficam em IndexedDB e num cookie de longa duração (reserva). */
const DUR = { jv_sess: "jv_r", jv_passkey: "jv_p", jv_faceok: "jv_f" };
function cookieSet(n, v){ try{ document.cookie = n + "=" + encodeURIComponent(v) + "; max-age=34560000; path=/; SameSite=Lax" + (location.protocol === "https:" ? "; Secure" : ""); }catch(e){} }
function cookieGet(n){ try{ const m = document.cookie.match(new RegExp("(?:^|; )" + n + "=([^;]*)")); return m ? decodeURIComponent(m[1]) : null; }catch(e){ return null; } }
function cookieDel(n){ try{ document.cookie = n + "=; max-age=0; path=/"; }catch(e){} }
let idbP = null;
function idb(){ if(!idbP) idbP = new Promise((res, rej) => { try{ const r = indexedDB.open("jarvis-dur", 1); r.onupgradeneeded = () => r.result.createObjectStore("k"); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }catch(e){ rej(e); } }); return idbP; }
async function idbPut(k, v){ try{ const d = await idb(); d.transaction("k", "readwrite").objectStore("k").put(v, k); }catch(e){} }
async function idbDel(k){ try{ const d = await idb(); d.transaction("k", "readwrite").objectStore("k").delete(k); }catch(e){} }
async function idbGet(k){ try{ const d = await idb(); return await new Promise(res => { const q = d.transaction("k").objectStore("k").get(k); q.onsuccess = () => res(q.result === undefined ? null : q.result); q.onerror = () => res(null); }); }catch(e){ return null; } }
const ARM = {
  get(k){ try{ return JSON.parse(localStorage.getItem(k)); }catch(e){ return null; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} if(DUR[k]){ idbPut(k, v); cookieSet(DUR[k], k === "jv_sess" ? (v && v.refresh_token) || "" : v); } },
  del(k){ try{ localStorage.removeItem(k); }catch(e){} if(DUR[k]){ idbDel(k); cookieDel(DUR[k]); } }
};
/* devolve true se precisou restaurar alguma coisa que o iOS apagou */
async function hidrata(){
  let rest0 = false;
  for(const k of Object.keys(DUR)){
    if(ARM.get(k) != null) continue;
    let v = await idbGet(k);
    if(v == null){ const c = cookieGet(DUR[k]); if(c) v = k === "jv_sess" ? { access_token: "", refresh_token: c, expira: 0 } : (k === "jv_faceok" ? Number(c) : c); }
    if(v != null){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} rest0 = true; }
  }
  sess = ARM.get("jv_sess"); return rest0;
}
const $q = id => document.getElementById(id);
let sess = ARM.get("jv_sess");

/* ---------- Supabase (REST + login), sem bibliotecas ---------- */
/* pedido que não volta em 8 s conta como falha: a tela avisa "Sem contato" em vez de ficar esperando */
function busca(url, opc){
  const c = new AbortController(), t = setTimeout(() => c.abort(), 8000);
  return fetch(url, Object.assign({ cache: "no-store", signal: c.signal }, opc)).finally(() => clearTimeout(t));
}
async function authPost(caminho, corpo){
  const r = await busca(CFG.url + "/auth/v1/" + caminho, { method: "POST", headers: { apikey: CFG.anon, "Content-Type": "application/json" }, body: JSON.stringify(corpo) });
  const j = await r.json().catch(() => ({}));
  if(!r.ok){ const e = new Error(j.error_description || j.msg || j.message || "não consegui entrar"); e.status = r.status; throw e; }
  return j;
}
function guardaSessao(j){ sess = { access_token: j.access_token, refresh_token: j.refresh_token, expira: Date.now() + (j.expires_in || 3600) * 1000 - 60000 }; ARM.set("jv_sess", sess); }
let renovando = null;
async function token(){
  if(!sess) throw new Error("sem login");
  if(Date.now() > sess.expira){
    renovando = renovando || authPost("token?grant_type=refresh_token", { refresh_token: sess.refresh_token }).then(guardaSessao).finally(() => { renovando = null; });
    try{ await renovando; }
    catch(e){ if(e && (e.status === 400 || e.status === 401 || e.status === 403)){ sess = null; ARM.del("jv_sess"); mostraLogin(); } throw e; }   // só pede login se o servidor RECUSOU o refresh; falha de rede mantém a sessão
  }
  return sess.access_token;
}
async function rest(caminho, opc){
  opc = opc || {};
  const t = await token();
  const r = await busca(CFG.url + "/rest/v1/" + caminho, Object.assign({}, opc, { headers: Object.assign({ apikey: CFG.anon, Authorization: "Bearer " + t, "Content-Type": "application/json" }, opc.headers || {}) }));
  if(r.status === 401 && !opc._tentou && sess){ sess.expira = 0; await token(); return rest(caminho, Object.assign({}, opc, { _tentou: true })); }   // 401 = token velho: renova uma vez antes de pedir login
  if(r.status === 401){ sess = null; ARM.del("jv_sess"); mostraLogin(); throw new Error("sessão expirou"); }
  const txt = await r.text();
  if(!r.ok) throw new Error(txt.slice(0, 160));
  return txt ? JSON.parse(txt) : null;
}

/* ---------- login (só o dono) e Face ID de quem já tinha ligado ---------- */
function mostraLogin(){ document.body.classList.add("semlogin"); $q("trava").classList.remove("on"); $q("login").classList.add("on"); }
const fcDeb64 = t => Uint8Array.from(atob(t.replace(/-/g, "+").replace(/_/g, "/")), c => c.charCodeAt(0));
const faceSuporte = () => !!(window.PublicKeyCredential && navigator.credentials && navigator.credentials.get);
const faceAtivo = () => !!ARM.get("jv_passkey");
const FACE_DIAS = 90, faceFresco = () => Date.now() - (ARM.get("jv_faceok") || 0) < FACE_DIAS * 86400000;
async function faceVerifica(){
  const id = ARM.get("jv_passkey"); if(!id) return true;
  const a = await navigator.credentials.get({ publicKey: { challenge: crypto.getRandomValues(new Uint8Array(32)), rpId: location.hostname, timeout: 60000, userVerification: "required", allowCredentials: [{ type: "public-key", id: fcDeb64(id), transports: ["internal"] }] } });
  return !!a;
}
function travaApp(){ $q("travaSai").style.display = "none"; document.body.classList.add("travado"); $q("login").classList.remove("on"); $q("trava").classList.add("on"); $q("travaErr").textContent = ""; }
async function destrava(){
  $q("travaErr").textContent = "";
  let ok = false; try{ ok = await faceVerifica(); }catch(e){ ok = false; }
  if(!ok){ $q("travaErr").textContent = "Não reconheci. Toque em Entrar para tentar de novo."; $q("travaSai").style.display = ""; return; }
  ARM.set("jv_faceok", Date.now());
  document.body.classList.remove("travado"); $q("trava").classList.remove("on"); iniciaSessao();
}
$q("travaAbre").onclick = destrava;
$q("travaSai").onclick = () => { sess = null; ARM.del("jv_sess"); ARM.del("jv_passkey"); location.reload(); };
async function garanteDono(){
  let eh = await rest("rpc/jarvis_eh_dono", { method: "POST", body: "{}" });
  if(eh !== true){ await rest("rpc/jarvis_reivindicar", { method: "POST", body: "{}" }); eh = await rest("rpc/jarvis_eh_dono", { method: "POST", body: "{}" }); }
  if(eh !== true){ sess = null; ARM.del("jv_sess"); const e = new Error("Esta conta não é a do dono do Jarvis."); e.naoDono = true; throw e; }
}
async function entrar(){
  $q("loginErr").textContent = ""; $q("entrar").disabled = true;
  try{
    guardaSessao(await authPost("token?grant_type=password", { email: $q("em").value.trim(), password: $q("sn").value }));
    $q("sn").value = ""; ARM.set("jv_faceok", Date.now());
    await garanteDono();
    $q("login").classList.remove("on"); document.body.classList.remove("semlogin");
    comeca();
  }catch(e){ $q("loginErr").textContent = String(e.message || e); sess = null; ARM.del("jv_sess"); }
  $q("entrar").disabled = false;
}
$q("entrar").onclick = entrar;
$q("sn").addEventListener("keydown", e => { if(e.key === "Enter") entrar(); });

/* ---------- os cartões ---------- */
const VALE = 70000;          /* o PC grava a cada 20 s: mais que isto sem gravar = sem contato */
const VALE_RENOVA = 180000;
const SIT = { trab: ["Trabalhando", "var(--verde)", 0], test: ["Testando", "var(--azul)", 1], erro: ["Com erro", "var(--vermelho)", 2], parado: ["Parado", "var(--precisa)", 3], terminou: ["Terminou", "var(--lilas)", 4], livre: ["Livre", "var(--apagado)", 5] };
let linhaJan = ARM.get("jv_janelas"), linhaConta = null, falhou = false, tentei = false, sigTela = "";
const idade = l => l ? Date.now() - new Date(l.atualizado_em).getTime() : Infinity;
const doisN = x => String(x).padStart(2, "0");
function quando(ms){
  const d = new Date(ms), h = doisN(d.getHours()) + ":" + doisN(d.getMinutes());
  return d.toDateString() === new Date().toDateString() ? "às " + h : "em " + doisN(d.getDate()) + "/" + doisN(d.getMonth() + 1) + " às " + h;
}
function haQuanto(seg){
  const m = Math.floor((Date.now() / 1000 - seg) / 60);
  if(m < 1) return "menos de 1 min";
  if(m < 60) return m + " min";
  const h = Math.floor(m / 60);
  return h < 24 ? h + " h " + doisN(m % 60) : Math.floor(h / 24) + (h < 48 ? " dia" : " dias");
}
function el(tag, classe, texto){ const d = document.createElement(tag); if(classe) d.className = classe; if(texto != null) d.textContent = texto; return d; }
function cartao(j, velho){
  const s = SIT[j.sit] || SIT.livre, c = el("article", "jan " + (SIT[j.sit] ? j.sit : "livre")); c.style.setProperty("--cor", s[1]); c.dataset.id = j.id;
  const l1 = el("div", "l1"), chip = el("span", "sit"); chip.append(el("i"), el("span", null, s[0])); l1.append(el("h2", null, j.nome), chip); c.append(l1);
  const fila = j.fila > 0 ? j.fila + (j.fila > 1 ? " tarefas na fila" : " tarefa na fila") : "Nada na fila";
  if(j.titulo) c.append(el("div", "tit", j.titulo));
  if(j.nota) c.append(el("div", "nota", j.nota.charAt(0).toUpperCase() + j.nota.slice(1)));
  if(j.titulo){
    const andando = j.sit !== "terminou" && j.sit !== "erro", atual = andando ? Math.min(j.x + 1, j.n) : j.x;
    const l2 = el("div", "l2");
    l2.append(el("span", "parte", j.n ? "Parte " + atual + " de " + j.n : "Sem contagem de partes"));
    const antes = j.sit === "terminou" ? "terminou há " : j.sit === "erro" ? "parou há " : j.n ? "nesta parte há " : "há ";
    l2.append(el("span", "tempo", j.desde && !velho ? antes + haQuanto(j.desde) : ""));
    c.append(l2);
    if(j.n){ const b = el("div", "barra"), i = el("i"); i.style.width = Math.round(100 * Math.min(j.x, j.n) / j.n) + "%"; b.append(i); c.append(b); }
  }
  c.append(el("div", "fila", fila));
  return c;
}
function desenha(){
  const lista = linhaJan && linhaJan.dados && Array.isArray(linhaJan.dados.janelas) ? linhaJan.dados.janelas : null;
  const velho = tentei && (falhou || idade(linhaJan) > VALE);
  $q("semContato").classList.toggle("on", velho);
  $q("semHora").textContent = !velho ? "" : linhaJan ? "Última informação " + quando(new Date(linhaJan.atualizado_em).getTime()) + ". O que aparece abaixo é dessa hora." : "Ainda não recebi nada do PC.";
  /* os minutos entram na assinatura: o cartão só é refeito quando algo muda (o brilho não reinicia) */
  const sig = JSON.stringify([lista, velho, tentei, lista && lista.map(j => j.desde ? haQuanto(j.desde) : "")]);
  if(sig !== sigTela){
    sigTela = sig;
    const box = $q("cartoes"); box.innerHTML = ""; box.classList.toggle("velho", velho);
    if(!lista){ if(!velho) box.append(el("div", "vazio", tentei ? "O PC ainda está preparando os cartões. Aguarde um instante." : "Carregando…")); }
    else lista.slice().sort((a, b) => ((SIT[a.sit] || SIT.livre)[2] - (SIT[b.sit] || SIT.livre)[2]) || (a.id - b.id)).forEach(j => box.append(cartao(j, velho)));
  }
  const d = linhaConta && linhaConta.dados, r = d && d.d7r && !falhou && idade(linhaConta) < VALE_RENOVA ? String(d.d7r) : "";
  $q("renovaTxt").textContent = r ? "em " + r.replace(/([dh])(?=\d)/g, "$1 ") : "sem leitura";
}
let puxando = null;
function puxa(){
  if(!sess) return Promise.resolve();
  puxando = puxando || (async () => {
    try{
      const r = (await rest("jarvis_uso?id=in.(pontinho,conta)&select=id,dados,atualizado_em")) || [];
      const p = r.find(x => x.id === "pontinho"); if(p){ linhaJan = p; ARM.set("jv_janelas", p); }
      linhaConta = r.find(x => x.id === "conta") || null; falhou = false;
    }catch(e){ falhou = true; }
    tentei = true; desenha();
  })().finally(() => { puxando = null; });
  return puxando;
}
let relogio = null;
function comeca(){
  desenha(); puxa();
  if(!relogio) relogio = setInterval(() => { if(!document.hidden){ puxa(); desenha(); } }, 5000);
}
addEventListener("offline", () => { falhou = true; tentei = true; desenha(); });
addEventListener("online", puxa);

/* ---------- puxar a tela para baixo = atualizar ---------- */
(function(){
  const rola = $q("rola"), aviso = $q("puxa"); let y0 = null, d = 0;
  rola.addEventListener("touchstart", e => { y0 = rola.scrollTop <= 0 && e.touches.length === 1 ? e.touches[0].clientY : null; d = 0; }, { passive: true });
  rola.addEventListener("touchmove", e => {
    if(y0 === null) return;
    d = e.touches[0].clientY - y0;
    if(d <= 0){ aviso.style.height = "0px"; return; }
    if(e.cancelable) e.preventDefault();
    aviso.style.height = Math.min(64, d / 2) + "px"; aviso.textContent = d > 90 ? "Solte para atualizar" : "Puxe para atualizar";
  }, { passive: false });
  const solta = async () => {
    const vai = y0 !== null && d > 90; y0 = null; d = 0;
    if(!vai){ aviso.style.height = "0px"; return; }
    aviso.style.height = "40px"; aviso.textContent = "Atualizando…";
    await puxa(); aviso.style.height = "0px";
  };
  rola.addEventListener("touchend", solta); rola.addEventListener("touchcancel", () => { y0 = null; aviso.style.height = "0px"; });
})();

/* ---------- tela inteira, tela ligada, versão nova e arranque ---------- */
function ajustaAltura(){ const v = window.visualViewport, h = v ? v.height : innerHeight; document.documentElement.style.setProperty("--vh", Math.round(h) + "px"); if(v && v.offsetTop) scrollTo(0, 0); }
if(window.visualViewport){ visualViewport.addEventListener("resize", ajustaAltura); visualViewport.addEventListener("scroll", ajustaAltura); }
addEventListener("orientationchange", () => setTimeout(ajustaAltura, 250)); addEventListener("resize", ajustaAltura); ajustaAltura();
let telaTrava = null;
async function mantemTela(){ try{ if(!("wakeLock" in navigator) || document.hidden || (telaTrava && !telaTrava.released)) return; telaTrava = await navigator.wakeLock.request("screen"); }catch(e){} }
mantemTela(); document.addEventListener("pointerdown", mantemTela, { passive: true });
let swReg = null;
if("serviceWorker" in navigator){
  const tinhaControle = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.register("sw.js", { updateViaCache: "none" }).then(r => { swReg = r; r.update().catch(() => {}); }).catch(() => {});
  navigator.serviceWorker.addEventListener("controllerchange", () => { if(tinhaControle) location.reload(); });   // versão nova instalada: recarrega sozinho
}
async function confereVersao(){
  try{
    const r = await fetch("version.json?t=" + Date.now(), { cache: "no-store" }); const j = await r.json();
    if(j.versao && j.versao !== VERSAO){
      if(swReg) await swReg.update().catch(() => {});
      if(!navigator.serviceWorker || !navigator.serviceWorker.controller) location.reload();
    }
  }catch(e){}
}
setInterval(() => { if(!document.hidden) confereVersao(); }, 10 * 60 * 1000);
document.addEventListener("visibilitychange", () => {
  if(document.hidden) return;
  mantemTela(); confereVersao();
  if(faceAtivo() && sess && !faceFresco()){ travaApp(); return; }   // só depois de 90 dias sem Face ID
  desenha(); puxa();
});

async function iniciaSessao(){
  if(!sess){ mostraLogin(); return; }
  document.body.classList.remove("semlogin"); comeca();                       // mostra já (sem rede aparece "Sem contato"), sem voltar ao login
  try{ await garanteDono(); }catch(e){ if(e.naoDono) mostraLogin(); }
}
(async function arranque(){
  const restaurou = await hidrata();          // se o iOS limpou o localStorage, volta da reserva (IndexedDB/cookie)
  if(!sess){ mostraLogin(); return; }
  if(faceAtivo() && faceSuporte() && (restaurou || !faceFresco())){ travaApp(); setTimeout(() => { try{ destrava(); }catch(e){} }, 300); return; }
  iniciaSessao();
})();

</script></body></html>
