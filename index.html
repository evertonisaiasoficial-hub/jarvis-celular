<style>
  /* HOLOGRAMA: fundo escuro profundo, vidro fosco com reflexo, luz neon rosa/violeta discreta nas bordas, orbe no cabeçalho, varredura de luz. Inter. */
  :root{
    --bg:#070b18; --bg2:#0c1430; --bg3:#1a2858;   /* v24: modo escuro mais profundo (contraste no carro) */
    --cy:#ffc15e; --cy2:#ffe2ad; --acc2:#ff8a3d;
    --txt:#ffffff; --dim:#c9d2f5; --line:rgba(255,255,255,.09);
    --glass:rgba(255,255,255,.05); --glass2:rgba(255,255,255,.09);
    --amb:#ffc15e; --ok:#ffc15e; --bad:#8088a6; --term:rgba(0,0,0,.28);
    --f:Inter,"Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;
    --edge:color-mix(in srgb,var(--cy) 26%,rgba(255,255,255,.07));
  }
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--txt);font:14px/1.4 var(--f);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
/* v24: fundo transparente (a tela do app pinta o fundo escuro); só um brilho suave atrás do símbolo, que some antes da borda (sem emenda) */
body{background:radial-gradient(closest-side at 50% 50%,color-mix(in srgb,var(--cy) 20%,transparent),transparent 100%)}
html{background:transparent}   /* v24: sem emenda com o fundo da tela do app */
body.mudo #stage{opacity:.38}
body.mudo #orbwrap,body.mudo #orbwrap>i{animation-play-state:paused}   /* v24: mudo = símbolo apagado e parado (menos CPU) */
body.bolha{background:transparent}
#stage{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);transition:filter .45s}

#msg{display:none;position:absolute;left:0;right:0;bottom:6%;text-align:center;color:var(--dim);font-size:16px;letter-spacing:.04em;padding:0 8%}
body.bolha #msg{display:none}
/* símbolo: copiado do painel do PC (painel.html) */
  #orbwrap{--s:176px;width:var(--s);height:var(--s);position:relative;flex:0 0 auto;display:grid;place-items:center;animation:float 6s ease-in-out infinite}
  #orbwrap>i{position:absolute;border-radius:50%;display:block}
  #orbwrap .halo{inset:-40%;background:radial-gradient(circle,color-mix(in srgb,var(--cy) 30%,transparent),transparent 62%);animation:pulse 4s ease-in-out infinite}
  #orbwrap .tick{inset:0;background:repeating-conic-gradient(color-mix(in srgb,var(--cy) 85%,transparent) 0 .8deg,transparent .8deg 5deg);
    -webkit-mask:radial-gradient(farthest-side,transparent 92%,#000 93%);mask:radial-gradient(farthest-side,transparent 92%,#000 93%);animation:spin 60s linear infinite;opacity:.75}
  #orbwrap .seg{inset:8%;background:conic-gradient(var(--cy) 0 70deg,transparent 70deg 120deg,color-mix(in srgb,var(--cy) 60%,transparent) 120deg 200deg,transparent 200deg 250deg,var(--cy) 250deg 300deg,transparent 300deg);
    -webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 3px),#000 calc(100% - 2px));mask:radial-gradient(farthest-side,transparent calc(100% - 3px),#000 calc(100% - 2px));animation:spin 14s linear infinite;opacity:.95}   /* v24: sem drop-shadow animado (pesava a GPU fraca da central) */
  #orbwrap .dash{inset:17%;background:repeating-conic-gradient(color-mix(in srgb,var(--cy) 70%,transparent) 0 10deg,transparent 10deg 16deg);
    -webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 2px),#000 calc(100% - 1px));mask:radial-gradient(farthest-side,transparent calc(100% - 2px),#000 calc(100% - 1px));animation:spin 22s linear infinite reverse}
  #orbwrap .wave{inset:30%;border:1px solid var(--cy);opacity:0;animation:wave 3.4s ease-out infinite}#orbwrap .wave.w2{animation-delay:1.7s}
  #orb{position:relative;z-index:2}   /* sem filter: o brilho já está desenhado no canvas (o drop-shadow gerava um bloco quadrado) */
  #htx{display:flex;align-items:center;gap:12px;min-width:0}
  .brand{font-size:13px;font-weight:300;letter-spacing:.42em;color:var(--txt)}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes float{50%{transform:translateY(-3px)}}
  @keyframes wave{0%{transform:scale(1);opacity:.5}100%{transform:scale(2.2);opacity:0}}
  @keyframes pulse{50%{opacity:.4}}


/* ====== Jarvis iPhone v2 ====== */
:root{--red:#ff4d5e;--grn:#3ee08f;--yel:#ffd24a;--mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;--navh:64px}
html,body{height:100%;overscroll-behavior:none}
body{background:radial-gradient(120% 70% at 50% 0%,#14204a 0%,var(--bg) 55%) fixed,var(--bg);-webkit-text-size-adjust:100%}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:1;background:repeating-linear-gradient(0deg,rgba(255,255,255,.018) 0 1px,transparent 1px 3px)}
#app{position:fixed;inset:0;display:flex;flex-direction:column;padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left);z-index:2}
button{font:inherit;color:inherit;border:none;background:none;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:active{transform:scale(.97)}
/* topo: terminais + máquina */
#topo{display:flex;align-items:center;gap:8px;padding:8px 12px 6px}
#chips{flex:1;display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;min-width:0}
#chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;display:flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:var(--glass);font:500 12.5px var(--f);white-space:nowrap}
.chip.sel{border-color:color-mix(in srgb,var(--cy) 60%,transparent);background:color-mix(in srgb,var(--cy) 14%,transparent);box-shadow:0 0 14px color-mix(in srgb,var(--cy) 22%,transparent)}
.d{width:8px;height:8px;border-radius:50%;background:#6f738f;flex:0 0 auto}
[data-e="trab"] .d{background:var(--yel);box-shadow:0 0 8px var(--yel);animation:pisca 1s ease-in-out infinite}
[data-e="livre"] .d{background:var(--grn)}
[data-e="perg"] .d{background:var(--red);box-shadow:0 0 8px var(--red)}
[data-p="1"] .d{background:#8a8fb0;animation:none;box-shadow:none}
.chip .p{color:var(--cy);font-weight:600;font-variant-numeric:tabular-nums}
@keyframes pisca{50%{opacity:.35}}
#maq{flex:0 0 auto;font:600 10.5px var(--mono);color:var(--dim);text-align:right;line-height:1.25;letter-spacing:.02em}
#maq b{color:var(--cy);font-weight:600}
#aviso{display:none;margin:0 12px 6px;padding:8px 12px;border-radius:12px;background:rgba(255,77,94,.12);border:1px solid rgba(255,77,94,.4);color:#ffb3ba;font-size:12.5px}
#aviso.on{display:block}
/* corpo: painéis */
#corpo{flex:1;min-height:0;position:relative}
.painel{position:absolute;inset:0;display:none;flex-direction:column;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:4px 12px 12px}
.painel.on{display:flex}
.tit{font:600 11px var(--f);letter-spacing:.16em;text-transform:uppercase;color:var(--cy);margin:12px 2px 8px;display:flex;align-items:center;gap:8px}
.tit .sp{flex:1}
.vidro{border:1px solid var(--edge);border-radius:18px;background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.025));box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 10px 30px rgba(0,0,0,.25)}
/* ligação */
#pLig{align-items:stretch}
#orbBox{position:relative;flex:0 0 auto;height:min(29vh,260px);min-height:160px}
#versao{text-align:center;font:600 11px var(--mono);letter-spacing:.2em;color:var(--dim);opacity:.85;margin-top:-6px}
#legenda{text-align:center;padding:10px 6% 4px;color:#e3e6fb;font-size:16px;line-height:1.4;min-height:56px}
#legenda small{display:block;color:var(--dim);font-size:13px;margin-top:4px}
#estadoLig{text-align:center;font:600 11px var(--f);letter-spacing:.14em;text-transform:uppercase;color:var(--dim);min-height:16px}
#estadoLig.on{color:var(--grn)}
#vivo{display:flex;flex-direction:column;gap:8px}
.mini{display:flex;gap:10px;align-items:flex-start;padding:10px 12px}
.mini .d{margin-top:5px}
.mini .c{flex:1;min-width:0}
.mini .n{font:600 13px var(--f);display:flex;gap:8px}
.mini .n .tm{margin-left:auto;color:var(--dim);font:500 11px var(--mono)}
.mini .a{font-size:12.5px;color:var(--yel);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.mini .l{font:11px var(--mono);color:#9aa3c9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.pz{font:600 10px var(--f);letter-spacing:.1em;color:#c3c7e4;background:rgba(255,255,255,.1);padding:1px 7px;border-radius:99px}
#resumoLig{display:flex;gap:8px;margin-top:8px}
#resumoLig button{flex:1;padding:12px;font:600 13px var(--f)}
#resumoLig b{color:var(--cy)}
/* terminais ao vivo */
#termAbas{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;padding:2px 0 8px;flex:0 0 auto}
#termAbas::-webkit-scrollbar{display:none}
#termCab{padding:10px 12px;flex:0 0 auto}
#termCab .l1{display:flex;align-items:center;gap:8px;font:600 14px var(--f)}
#termCab .l1 .tm{margin-left:auto;font:500 12px var(--mono);color:var(--dim)}
#termCab .at{margin-top:6px;padding:7px 10px;border-radius:10px;background:rgba(255,210,74,.12);border:1px solid rgba(255,210,74,.45);color:var(--yel);font-size:13px}
#termCab .at:empty{display:none}
#termSaida{flex:0 0 auto;height:max(220px,48vh);margin:8px 0;padding:10px 12px;overflow:auto;-webkit-overflow-scrolling:touch;white-space:pre-wrap;word-break:break-word;
  font:11.5px/1.45 var(--mono);color:#d7dcf5;background:rgba(0,0,0,.42);border:1px solid var(--line);border-radius:14px;-webkit-user-select:text;user-select:text}
#termFila{flex:0 0 auto}
#voltaFim{position:sticky;bottom:6px;align-self:center;display:none;padding:6px 14px;border-radius:99px;background:var(--cy);color:#1a1206;font:600 12px var(--f)}
/* tarefas */
.tar{display:flex;align-items:center;gap:8px;padding:9px 10px;margin-bottom:6px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.035);font-size:13px;line-height:1.35}
.tar .nn{flex:0 0 auto;min-width:28px;font:600 12px var(--mono);color:var(--dim)}
.tar .tt{flex:1;min-width:0;word-break:break-word}
.tar .tt small{display:block;color:#ff9aa4;font-size:12px;margin-top:2px}
.tar[data-e="exec"]{border-color:rgba(255,210,74,.55);background:rgba(255,210,74,.12)}
.tar[data-e="exec"] .nn,.tar[data-e="exec"] .tt{color:var(--yel)}
.tar[data-e="erro"]{border-color:rgba(255,77,94,.55);background:rgba(255,77,94,.10)}
.tar[data-e="erro"] .nn,.tar[data-e="erro"] .tt{color:#ff8a95}
.tar.pm{border-color:color-mix(in srgb,var(--cy) 70%,transparent);box-shadow:0 0 12px color-mix(in srgb,var(--cy) 25%,transparent)}
.bpm,.bcor{flex:0 0 auto;padding:8px 10px;border-radius:10px;font:600 12px var(--f);background:rgba(255,255,255,.08)}
.bpm.on{background:linear-gradient(135deg,var(--cy),var(--acc2));color:#1a1206}
.bcor{background:rgba(255,77,94,.22);color:#ffd0d4;border:1px solid rgba(255,77,94,.5)}
.vazio{padding:16px;text-align:center;color:var(--dim);font-size:13px}
/* ideias e avisos */
.idea{padding:12px;margin-bottom:10px}
.idea .pr{font:600 10px var(--f);letter-spacing:.14em;text-transform:uppercase;color:var(--cy)}
.idea h3{font:600 14px var(--f);margin:5px 0 4px}
.idea p{font-size:12.5px;color:#b8bedf;line-height:1.45}
.idea .ac{display:flex;gap:8px;margin-top:10px}
.idea .ac button{flex:1;padding:11px;border-radius:11px;font:600 13px var(--f)}
.bok{background:linear-gradient(135deg,var(--cy),var(--acc2));color:#1a1206}
.bno{background:rgba(255,255,255,.09)}
.btop{padding:8px 12px;border-radius:10px;font:600 12px var(--f)}
.avi{display:flex;gap:10px;padding:10px 12px;margin-bottom:7px}
.avi .ic{font-size:18px;line-height:1}
.avi .c{flex:1;min-width:0}
.avi .t{font:600 13px var(--f)}
.avi .x{font-size:12.5px;color:#b8bedf;margin-top:2px;word-break:break-word}
.avi .h{font:11px var(--mono);color:var(--dim);margin-top:3px}
.avi[data-t="pix"],.avi[data-t="captcha"],.avi[data-t="login"]{border-color:rgba(255,77,94,.5)}
/* ações (uma mão) */
#acoes{flex:0 0 auto;display:flex;align-items:center;justify-content:center;gap:14px;padding:8px 14px 6px}
#ligar{width:84px;height:84px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,var(--grn),#1fa866);color:#fff;box-shadow:0 0 30px rgba(62,224,143,.35),inset 0 2px 0 rgba(255,255,255,.3)}
#ligar.on{background:linear-gradient(135deg,#ff6b78,#d92c43);color:#fff;box-shadow:0 0 34px rgba(255,77,94,.5);animation:anel 1.6s ease-out infinite}
@keyframes anel{0%{box-shadow:0 0 0 0 rgba(255,77,94,.55)}100%{box-shadow:0 0 0 22px rgba(255,77,94,0)}}
#parar{min-width:96px;height:52px;padding:0 14px;border-radius:16px;font:700 13px var(--f);letter-spacing:.04em;background:linear-gradient(135deg,#ff4d5e,#b3122a);color:#fff;box-shadow:0 0 18px rgba(255,77,94,.35)}
#parar.ret{background:linear-gradient(135deg,var(--grn),#1fa866);color:#03140b;box-shadow:none}
#tecBtn{width:52px;height:52px;border-radius:16px;background:var(--glass2);font-size:20px}
#teclado{display:none;gap:8px;padding:0 12px 6px}
#teclado.on{display:flex}
#teclado input{flex:1;padding:12px 14px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.07);color:var(--txt);font:16px var(--f);-webkit-user-select:text;user-select:text}
#teclado button{padding:0 16px;border-radius:999px;background:var(--cy);color:#1a1206;font:600 14px var(--f)}
/* navegação de baixo */
#nav{flex:0 0 auto;display:flex;padding:4px 6px calc(env(safe-area-inset-bottom) + 4px);border-top:1px solid var(--line);background:rgba(7,11,24,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
#nav button{flex:1;position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 2px;font:600 10.5px var(--f);color:var(--dim)}
#nav button i{font-style:normal;font-size:19px;line-height:1.1}
#nav button.on{color:var(--cy)}
#nav b{position:absolute;top:2px;left:calc(50% + 6px);min-width:17px;height:17px;line-height:17px;padding:0 4px;border-radius:99px;font-size:10px;background:var(--acc2);color:#fff}
#nav b.r{background:var(--red)}
/* cartões (login) e toast */
.cartao{position:fixed;inset:0;z-index:40;display:none;align-items:center;justify-content:center;background:rgba(5,6,10,.88);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);padding:24px}
.cartao.on{display:flex}
.caixa{width:100%;max-width:380px;padding:22px}
.caixa h2{font:600 18px var(--f);margin-bottom:6px}
.caixa p.s{color:var(--dim);font-size:13px;line-height:1.5;margin-bottom:14px}
.caixa input{width:100%;padding:13px 14px;margin-bottom:10px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.06);color:var(--txt);font:16px var(--f);-webkit-user-select:text;user-select:text}
.caixa .ok{width:100%;padding:14px;border-radius:14px}
.caixa .err{color:#ff8a95;font-size:13px;min-height:18px;margin-bottom:8px}
#toast{position:fixed;left:12px;right:12px;top:calc(env(safe-area-inset-top) + 56px);z-index:50;display:none;padding:11px 14px;font-size:13.5px;line-height:1.4}
#toast.on{display:block}
#toast small{display:block;color:var(--dim);margin-top:2px}
#instala{display:none;margin:0 12px 6px;padding:10px 12px;font-size:12.5px;line-height:1.5}
#instala.on{display:block}
/* iPad / tela larga: Ligação fixa à esquerda + painel escolhido à direita (funciona dividido ao lado de outro app) */
@media (min-width:760px){
  #corpo{display:grid;grid-template-columns:minmax(300px,38%) 1fr;gap:0}
  .painel{position:relative;inset:auto;min-height:0}
  #pLig{display:flex;border-right:1px solid var(--line)}
  #nav button[data-p="pLig"]{display:none}
  #orbBox{height:min(30vh,280px)}
}
@media (max-height:640px){#orbBox{height:150px;min-height:150px}#ligar{width:70px;height:70px}}
</style></head>

<script src="config.js"></script>
<script>

const $ = id => document.getElementById(id);
let S = {mic: "nocall", lvl_claude: 0};
const BOLHA = /[?&]b=1/.test(location.search);
if (BOLHA) document.body.classList.add("bolha");
/* ======================= símbolo holográfico ======================= */
// Alta resolução: o canvas interno é maior que o tamanho na tela (supersampling) e acompanha a densidade da tela (HD/4K);
// o navegador reduz com filtro suave = bordas sem serrilhado. Partes fixas e o bloom são pré-renderizados UMA vez por estado.

/* ====== Jarvis iPhone v2 ====== */
const VERSAO = "v2";
const CFG = window.JARVIS_CFG;
const ARM = { get(k){ try{ return JSON.parse(localStorage.getItem(k)); }catch(e){ return null; } }, set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }, del(k){ try{ localStorage.removeItem(k); }catch(e){} } };
const $q = id => document.getElementById(id);
let sess = ARM.get("jv_sess");

/* ---------- Supabase (REST + login), sem bibliotecas ---------- */
async function authPost(caminho, corpo){
  const r = await fetch(CFG.url + "/auth/v1/" + caminho, { method: "POST", headers: { apikey: CFG.anon, "Content-Type": "application/json" }, body: JSON.stringify(corpo) });
  const j = await r.json().catch(() => ({}));
  if(!r.ok) throw new Error(j.error_description || j.msg || j.message || "não consegui entrar");
  return j;
}
function guardaSessao(j){ sess = { access_token: j.access_token, refresh_token: j.refresh_token, expira: Date.now() + (j.expires_in || 3600) * 1000 - 60000 }; ARM.set("jv_sess", sess); }
let renovando = null;
async function token(){
  if(!sess) throw new Error("sem login");
  if(Date.now() > sess.expira){
    renovando = renovando || authPost("token?grant_type=refresh_token", { refresh_token: sess.refresh_token }).then(guardaSessao).finally(() => { renovando = null; });
    await renovando;
  }
  return sess.access_token;
}
async function rest(caminho, opc){
  opc = opc || {};
  const t = await token();
  const r = await fetch(CFG.url + "/rest/v1/" + caminho, Object.assign({}, opc, { headers: Object.assign({ apikey: CFG.anon, Authorization: "Bearer " + t, "Content-Type": "application/json" }, opc.headers || {}) }));
  if(r.status === 401){ sess = null; ARM.del("jv_sess"); mostraLogin(); throw new Error("sessão expirou"); }
  const txt = await r.text();
  if(!r.ok) throw new Error(txt.slice(0, 160));
  return txt ? JSON.parse(txt) : null;
}

/* ---------- login (só o dono) ---------- */
function mostraLogin(){ $q("login").classList.add("on"); }
async function entrar(){
  $q("loginErr").textContent = ""; $q("entrar").disabled = true;
  try{
    guardaSessao(await authPost("token?grant_type=password", { email: $q("em").value.trim(), password: $q("sn").value }));
    $q("sn").value = "";
    await garanteDono();
    $q("login").classList.remove("on");
    iniciaSync();
  }catch(e){ $q("loginErr").textContent = String(e.message || e); sess = null; ARM.del("jv_sess"); }
  $q("entrar").disabled = false;
}
async function garanteDono(){
  let eh = await rest("rpc/jarvis_eh_dono", { method: "POST", body: "{}" });
  if(eh !== true){ await rest("rpc/jarvis_reivindicar", { method: "POST", body: "{}" }); eh = await rest("rpc/jarvis_eh_dono", { method: "POST", body: "{}" }); }
  if(eh !== true){ sess = null; ARM.del("jv_sess"); throw new Error("Esta conta não é a do dono do Jarvis."); }
}

const ESTADO = { trab: "Trabalhando", livre: "Livre", perg: "Esperando você" };
const filaDe = a => Array.isArray(a.fila) ? a.fila : [];

/* ---------- sincronia com o PC ---------- */
let sync = null, ocupado = false, ultAviso = ARM.get("jv_ultaviso") || 0, avisoIni = false;

  setInterval(() => { if(!document.hidden) puxaAvisos(); }, 8000);
  setInterval(() => { if(!document.hidden) olhando(); }, 20000);

async function olhando(){   // o PC manda a saída ao vivo mais rápido enquanto o app está aberto

const CAMPOS = "nome,estado,texto,pct,total,feito,fila,seg,pausada,cpu,ram,atualizado_em";
function verTerminal(){ return painelAtual === "pTerm" || (largo() && painelAtual === "pTerm"); }
const largo = () => matchMedia("(min-width:760px)").matches;
async function puxa(){
  if(ocupado) return; ocupado = true;
  try{
    const qs = [rest("jarvis_abas?select=" + CAMPOS + "&order=nome.asc"), rest("jarvis_ideias?select=*&decisao=is.null&order=id.asc")];
    if(verTerminal() && termSel) qs.push(rest("jarvis_abas?select=nome,saida&nome=eq." + encodeURIComponent(termSel)));
    const [a, i, s] = await Promise.all(qs);
    const antes = abas;
    abas = a || []; ideias = i || [];
    if(s && s[0]){ const x = abas.find(y => y.nome === s[0].nome); if(x) x.saida = s[0].saida; }
    const agora = Date.now();
    semSinal = !abas.length || abas.every(x => agora - new Date(x.atualizado_em).getTime() > 90000);
    if(!destino || !abas.find(x => x.nome === destino)) destino = (abas.find(x => x.nome === "Jarvis") || abas[0] || {}).nome || "";
    if(!termSel || !abas.find(x => x.nome === termSel)) termSel = destino;
    terminou(antes, abas);
    desenhaTudo();
    const av = $q("aviso"); av.classList.toggle("on", semSinal); av.textContent = semSinal ? "O PC está sem sinal (desligado ou sem o Jarvis). Os pedidos ficam guardados e saem quando ele voltar." : "";

function terminou(antes, depois){
  if(!antes.length) return;
  depois.forEach(n => {
    const o = antes.find(x => x.nome === n.nome);
    if(o && o.estado !== "perg" && n.estado === "perg" && ligado) falar(n.nome + " está esperando sua resposta.");
  });
}

  try{

function b64u(s){ const p = "=".repeat((4 - s.length % 4) % 4), b = atob((s + p).replace(/-/g, "+").replace(/_/g, "/")); return Uint8Array.from(b, c => c.charCodeAt(0)); }

async function ativaPush(){
  const instalado = navigator.standalone || matchMedia("(display-mode: standalone)").matches;
  if(!("serviceWorker" in navigator) || !("PushManager" in window) || !("Notification" in window)){
    toast("Notificações indisponíveis aqui", /iphone|ipad/i.test(navigator.userAgent) && !instalado ? "No iPhone: adicione o Jarvis à Tela de Início e abra pelo ícone (iOS 16.4 ou mais novo)." : "Este navegador não aceita notificações."); return;

    if(p !== "granted"){ toast("Notificações bloqueadas", "Libere em Ajustes > Notificações > Jarvis."); return; }
    const reg = await navigator.serviceWorker.ready;
    const sub = await reg.pushManager.getSubscription() || await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64u(CFG.vapid) });
    await salvaInscricao(sub);
    $q("ativaPush").textContent = "🔔 Ativadas ✓";

}

/* ---------- voz: ouvir (Ligação contínua, pt-BR) ---------- */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null, rapidos = 0, iniciouEm = 0, ouvindoAgora = false, nivel = 0, ligado = false, pensando = false, hist = [];
function paraRec(){ if(rec){ try{ rec.onend = null; rec.abort(); }catch(e){} rec = null; } ouvindoAgora = false; }
function escuta(){
  if(!ligado || falando || pensando) return;
  if(!SR){ legenda("Este navegador não reconhece voz.", "Use o ⌨ (o ditado do teclado do iPhone também funciona)."); return; }
  paraRec();
  const r = new SR(); rec = r; r.lang = "pt-BR"; r.interimResults = true; r.continuous = true; r.maxAlternatives = 1;
  iniciouEm = Date.now(); let enviado = false, ultimo = "", silencio = null;
  const envia = () => { if(enviado) return; const t = ultimo.trim(); if(t.length < 2) return; enviado = true; paraRec(); pergunta(t); };
  r.onstart = () => { ouvindoAgora = true; $q("estadoLig").textContent = "● Ouvindo…"; };
  r.onresult = e => {
    let txt = "", final = false;
    for(let i = e.resultIndex; i < e.results.length; i++){ txt += e.results[i][0].transcript; if(e.results[i].isFinal) final = true; }
    nivel = Math.min(1, .35 + Math.min(.5, txt.length / 60)); ultimo = txt;
    if(txt.trim()) legenda(txt.trim());
    clearTimeout(silencio);
    if(final){ rapidos = 0; envia(); } else silencio = setTimeout(envia, 1600);   // pausa de 1,6 s = fim da frase (o iOS demora a dar "final")
  };
  r.onerror = e => {
    if(e.error === "not-allowed" || e.error === "service-not-allowed"){ desliga(); legenda("O iPhone bloqueou o microfone.", "Ajustes > Safari > Microfone (ou Ajustes > Jarvis) e toque no botão verde de novo."); }
  };
  r.onend = () => {
    ouvindoAgora = false; nivel = 0; clearTimeout(silencio);
    if(!enviado && ultimo.trim().length >= 2){ envia(); return; }
    if(Date.now() - iniciouEm < 700) rapidos++; else rapidos = 0;
    if(ligado && !falando && !pensando){
      if(rapidos >= 8){ desliga(); legenda("O iPhone cortou o microfone.", "Toque no botão verde para ligar de novo."); return; }
      setTimeout(escuta, Math.min(2500, 200 + rapidos * 300));
    }
  };
  try{ r.start(); }catch(e){ setTimeout(escuta, 800); }
}

/* ---------- cérebro: Claude Haiku (Edge Function jarvis-cerebro; a chave fica no Supabase) ---------- */
async function pergunta(texto){
  if(/^(desliga|desligar|tchau|encerra|encerrar)( a ligacao| a ligação)?\.?$/i.test(texto.trim())){ await falar("Tchau! Desligando."); desliga(); return; }
  pensando = true; $q("estadoLig").textContent = "● Pensando…"; legenda(texto, "pensando…");
  let resp = null;
  try{
    const t = await token();
    const r = await fetch(CFG.url + "/functions/v1/jarvis-cerebro", { method: "POST", headers: { apikey: CFG.anon, Authorization: "Bearer " + t, "Content-Type": "application/json" },
      body: JSON.stringify({ fala: texto, hist: hist.slice(-6), aba: destino }) });
    resp = await r.json().catch(() => null);
    if(!r.ok && !(resp && resp.sem_ia)) throw new Error((resp && resp.erro) || ("erro " + r.status));
  }catch(e){ resp = { erro: String(e.message || e) }; }
  pensando = false;
  let fala;
  if(resp && resp.resposta){
    fala = resp.resposta;
    (resp.tarefas || []).forEach(x => toast(x.ok ? "Tarefa criada · " + x.terminal : "Não consegui criar a tarefa", x.pedido));
  } else if(resp && resp.sem_ia){
    fala = await reserva(texto);
  } else {
    fala = await reserva(texto, true);
  }
  hist.push({ q: texto, r: fala }); hist = hist.slice(-8);
  if(ligado || !SR) await falar(fala); else legenda(fala);
  if(ligado && !falando) setTimeout(escuta, 250);
}
/* sem IA (chave ainda não configurada ou sem rede para a IA): regras simples, como o app v1 */
const sem = s => Array.from(s).map(c => c.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase()).join("");
function aliasesDe(nome){ const n = sem(nome), a = [n]; if(/site/.test(n)) a.push("site"); else if(/cuida/.test(n)) a.push("cuida ai", "cuidai", "loja", "lojas", "cuida"); if(/carro/.test(n)) a.push("carro"); if(/trade/.test(n)) a.push("trade", "bolsa"); return a.sort((x, y) => y.length - x.length); }
async function reserva(o, falhou){
  const n = sem(o).replace(/^jarvis[ ,]*/, "");
  if(/^(status|como (esta|estao|anda|andam)|o que (esta|estao)|resumo)/.test(n)){
    if(!abas.length) return "O PC está sem sinal.";
    return abas.map(a => a.nome + ": " + (a.pausada ? "pausado" : ({ trab: "trabalhando", livre: "livre", perg: "esperando sua resposta" }[a.estado] || a.estado))).join(". ") + ".";
  }
  if(/^(oi|ola|e ai|ta ai|esta ai)\b/.test(n) || n.length < 4) return "Estou aqui. " + (falhou ? "A inteligência está fora agora; " : "") + "O que você quer que eu faça?";
  let aba = destino, texto = o;
  const md = n.match(/^(?:manda|mande|envia|passa|pede)?\s*(?:isso )?(?:para|pra|pro)\s+(?:o |a )?/);
  if(md){
    const resto = n.slice(md[0].length);
    achou: for(const a of [...abas].sort((x, y) => y.nome.length - x.nome.length)) for(const al of aliasesDe(a.nome)) if(resto.startsWith(al)){ aba = a.nome; texto = o.slice(o.length - resto.length + al.length).replace(/^[ ,.!?:]+/, ""); break achou; }
  }
  if(!aba) return "O PC está sem sinal, não sei para onde mandar.";
  const ok = await mandaPedido(aba, texto);
  return ok ? "Mandei para " + aba + "." + (falhou ? "" : "") : "Não consegui enviar. Verifique a internet.";
}

/* ---------- tela ligada, atualização automática, instalação e arranque ---------- */
async function mantemTela(){ try{ if("wakeLock" in navigator) await navigator.wakeLock.request("screen"); }catch(e){} }
document.addEventListener("visibilitychange", () => { if(!document.hidden){ mantemTela(); if(sess){ puxa(); puxaAvisos(); olhando(); } confereVersao(); } });
let swReg = null, atualizarDepois = false;
if("serviceWorker" in navigator){
  const tinhaControle = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.register("sw.js", { updateViaCache: "none" }).then(r => { swReg = r; r.update().catch(() => {}); }).catch(() => {});
  navigator.serviceWorker.addEventListener("controllerchange", () => {          // versão nova instalada: recarrega (se estiver em ligação, espera desligar)
    if(!tinhaControle) return;
    if(ligado){ atualizarDepois = true; toast("Versão nova pronta", "Atualizo quando a ligação terminar."); return; }
    location.reload();
  });
}
async function confereVersao(){
  try{
    const r = await fetch("version.json?t=" + Date.now(), { cache: "no-store" }); const j = await r.json();
    if(j.versao && j.versao !== VERSAO){
      if(swReg) await swReg.update().catch(() => {});
      if(!navigator.serviceWorker || !navigator.serviceWorker.controller){ if(!ligado) location.reload(); else atualizarDepois = true; }
    }
  }catch(e){}
}
setInterval(() => { if(!document.hidden) confereVersao(); }, 10 * 60 * 1000);
(function avisaVersao(){

})();

})();
